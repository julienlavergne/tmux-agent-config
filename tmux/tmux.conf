# Set window title to session name
set -g set-titles on
set -g set-titles-string "#{session_name}"

# Mouse support
set -g mouse on

# Enable clipboard integration
set -g set-clipboard on

# Scrollback buffer
set -g history-limit 50000

# Copy mode (vi-style)
setw -g mode-keys vi

set -g allow-passthrough on
set -s extended-keys on
